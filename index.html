<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a14">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%236366f1' width='100' height='100' rx='20'/><text x='50' y='68' font-size='55' text-anchor='middle' fill='white'>📅</text></svg>">
<title>Планировщик</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  :root {
    --bg-primary: #0a0a14;
    --bg-secondary: #14141f;
    --bg-tertiary: #0f0f1a;
    --bg-glass: rgba(20, 20, 31, 0.85);
    --border: #1f1f2e;
    --border-hover: #252535;
    --text-primary: #fafafa;
    --text-secondary: #e4e4e7;
    --text-muted: #a1a1aa;
    --text-dim: #71717a;
    --text-faint: #52525b;
    --accent: #6366f1;
    --accent-hover: #7c7ff5;
    --accent-glow: rgba(99, 102, 241, 0.3);
    --danger: #ef4444;
    --success: #22c55e;
    --warning: #f59e0b;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
    --tabbar-height: 64px;
  }
  
  body.light-theme {
    --bg-primary: #f5f5f7;
    --bg-secondary: #ffffff;
    --bg-tertiary: #f0f0f5;
    --bg-glass: rgba(255, 255, 255, 0.9);
    --border: #e5e5ea;
    --border-hover: #d1d1d6;
    --text-primary: #1c1c1e;
    --text-secondary: #3a3a3c;
    --text-muted: #636366;
    --text-dim: #8e8e93;
    --text-faint: #aeaeb2;
    --accent: #5856d6;
    --accent-hover: #6366f1;
    --accent-glow: rgba(88, 86, 214, 0.2);
  }
  
  html, body {
    height: 100%;
    overscroll-behavior: none;
  }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro", "Segoe UI", sans-serif;
    background: var(--bg-primary);
    color: var(--text-secondary);
    font-size: 15px;
    line-height: 1.5;
    transition: background 0.3s, color 0.3s;
    padding-top: var(--safe-top);
    padding-bottom: calc(var(--safe-bottom) + var(--tabbar-height));
    padding-left: var(--safe-left);
    padding-right: var(--safe-right);
  }
  
  .container {
    max-width: 560px;
    margin: 0 auto;
    padding: 16px 16px 20px;
  }
  
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    gap: 10px;
    padding: 0 4px;
  }
  
  h1 {
    font-size: 22px;
    color: var(--text-primary);
    font-weight: 700;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--accent), #a855f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  
  .week-badge {
    padding: 7px 14px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 12px;
    background: var(--bg-tertiary);
    color: var(--text-muted);
    border: 1px solid var(--border);
  }
  
  .week-badge.upper {
    background: linear-gradient(135deg, rgba(96, 165, 250, 0.2), rgba(96, 165, 250, 0.1));
    color: #60a5fa;
    border-color: rgba(96, 165, 250, 0.3);
  }
  
  .week-badge.lower {
    background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(168, 85, 247, 0.1));
    color: #a855f7;
    border-color: rgba(168, 85, 247, 0.3);
  }
  
  .top-actions { display: flex; gap: 6px; }
  
  .icon-btn {
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    color: var(--text-muted);
    cursor: pointer;
    font-size: 18px;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  
  .icon-btn:active {
    transform: scale(0.92);
    background: var(--border-hover);
  }
  
  .view { display: none; }
  .view.active { display: block; animation: fadeIn 0.25s; }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .calendar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  
  .calendar-header button {
    background: var(--bg-tertiary);
    color: var(--text-secondary);
    border: 1px solid var(--border);
    width: 44px;
    height: 44px;
    border-radius: 12px;
    font-size: 20px;
    cursor: pointer;
  }
  
  .calendar-header button:active { transform: scale(0.92); }
  
  .calendar-header h2 {
    font-size: 17px;
    text-transform: capitalize;
    color: var(--text-primary);
    font-weight: 700;
  }
  
  .weekdays, .days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
  }
  
  .weekdays div {
    text-align: center;
    font-size: 11px;
    color: var(--text-faint);
    padding: 8px 0;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  
  .day {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    position: relative;
    color: var(--text-muted);
    font-weight: 500;
    min-height: 40px;
  }
  
  .day:active { transform: scale(0.92); }
  .day.other-month { color: var(--text-faint); }
  .day.holiday {
    background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(239, 68, 68, 0.05));
    color: #fca5a5;
  }
  
  .day.today {
    background: linear-gradient(135deg, var(--accent), #a855f7);
    color: #fff;
    font-weight: 700;
  }
  
  .day.selected {
    background: var(--bg-tertiary);
    color: var(--text-primary);
    outline: 2px solid var(--accent);
    outline-offset: -2px;
    font-weight: 700;
  }
  
  .day.today.selected {
    background: linear-gradient(135deg, var(--accent), #a855f7);
    outline: 2px solid #a5b4fc;
  }
  
  .day-dots {
    position: absolute;
    bottom: 3px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 2px;
  }
  
  .day-dot { width: 4px; height: 4px; border-radius: 50%; }
  
  .tasks-section {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  
  .selected-date {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 12px;
    color: var(--text-primary);
  }
  
  .action-btn {
    width: 100%;
    padding: 14px;
    background: var(--bg-tertiary);
    border: 1px dashed var(--border);
    border-radius: 14px;
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 10px;
    min-height: 48px;
    transition: all 0.15s;
  }
  
  .action-btn:active {
    transform: scale(0.98);
    background: var(--border-hover);
    border-color: var(--accent);
  }
  
  .task-list { list-style: none; }
  
  .task-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 14px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: 14px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.15s;
    animation: slideIn 0.25s;
    position: relative;
  }
  
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: translateX(0); }
  }
  
  .task-item:active { transform: scale(0.98); }
  .task-item.done { opacity: 0.4; }
  .task-item.done .task-title { text-decoration: line-through; }
  .task-item.dragging { opacity: 0.5; }
  .task-item.drag-over {
    border-color: var(--accent);
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(168, 85, 247, 0.1));
  }
  
  .task-check {
    width: 24px;
    height: 24px;
    cursor: pointer;
    accent-color: var(--accent);
    margin-top: 2px;
    flex-shrink: 0;
  }
  
  .task-content { flex: 1; min-width: 0; }
  
  .task-header {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 2px;
  }
  
  .task-time {
    font-size: 13px;
    color: var(--accent);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  
  .task-time.allday {
    color: var(--text-faint);
    font-style: italic;
    font-weight: 500;
  }
  
  .task-title {
    font-size: 15px;
    color: var(--text-primary);
    font-weight: 600;
    word-break: break-word;
  }
  
  .task-desc {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 4px;
    line-height: 1.4;
    word-break: break-word;
  }
  
  .task-meta {
    display: flex;
    gap: 6px;
    margin-top: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  
  .category-badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 8px;
    font-weight: 700;
  }
  
  .recurring-badge {
    font-size: 11px;
    padding: 3px 8px;
    background: linear-gradient(135deg, rgba(96, 165, 250, 0.2), rgba(96, 165, 250, 0.1));
    color: #60a5fa;
    border-radius: 8px;
    font-weight: 700;
  }
  
  .pomodoro-btn {
    font-size: 11px;
    padding: 3px 8px;
    background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(239, 68, 68, 0.1));
    color: #ef4444;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
    border: none;
  }
  
  .task-actions {
    display: flex;
    gap: 2px;
    flex-shrink: 0;
  }
  
  .task-action-btn {
    background: none;
    border: none;
    color: var(--text-faint);
    font-size: 22px;
    cursor: pointer;
    padding: 6px;
    border-radius: 8px;
    min-width: 36px;
    min-height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .task-action-btn:active { transform: scale(0.9); }
  .task-action-btn.delete:active { color: var(--danger); }
  
  .empty {
    text-align: center;
    color: var(--text-faint);
    padding: 40px 0;
    font-size: 14px;
  }
  
  .day-group { margin-bottom: 20px; }
  
  .day-group-header {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  
  .day-group-header.overdue { color: var(--danger); }
  .day-group-header .count {
    font-size: 11px;
    color: var(--text-faint);
    font-weight: 500;
    text-transform: none;
  }
  
  .schedule-intro {
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 14px;
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.5;
  }
  
  .weekday-group { margin-bottom: 18px; }
  
  .weekday-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 10px;
    padding: 12px 14px;
    background: linear-gradient(135deg, var(--bg-tertiary), var(--bg-secondary));
    border-radius: 12px;
    border: 1px solid var(--border);
  }
  
  .weekday-header .count {
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 500;
  }
  
  .week-type-divider {
    font-size: 11px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 10px 0 6px 4px;
    font-weight: 700;
  }
  
  .week-type-divider.upper { color: #60a5fa; }
  .week-type-divider.lower { color: #a855f7; }
  
  /* Нижняя таб-бар */
  .tabbar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--bg-glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 8px 8px calc(8px + var(--safe-bottom));
    z-index: 50;
    gap: 4px;
  }
  
  .tabbar-btn {
    flex: 1;
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    padding: 8px 4px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    font-size: 10px;
    font-weight: 600;
    transition: all 0.2s;
    min-height: 56px;
  }
  
  .tabbar-btn .tab-icon { font-size: 22px; }
  
  .tabbar-btn.active {
    color: var(--accent);
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(168, 85, 247, 0.1));
  }
  
  .tabbar-btn:active { transform: scale(0.92); }
  
  /* Модалки */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
    padding: 0;
  }
  
  .modal-overlay.show { display: flex; animation: fadeIn 0.2s; }
  
  .modal {
    background: var(--bg-secondary);
    border-top: 1px solid var(--border);
    border-radius: 24px 24px 0 0;
    padding: 24px 20px calc(24px + var(--safe-bottom));
    width: 100%;
    max-width: 560px;
    max-height: 92vh;
    overflow-y: auto;
    animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  
  @media (min-width: 600px) {
    .modal-overlay { align-items: center; padding: 20px; }
    .modal {
      border-radius: 24px;
      border: 1px solid var(--border);
      max-height: 90vh;
    }
    @keyframes slideUp {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  }
  
  .modal-handle {
    width: 40px;
    height: 4px;
    background: var(--border-hover);
    border-radius: 2px;
    margin: -8px auto 16px;
  }
  
  .modal h3 {
    font-size: 20px;
    color: var(--text-primary);
    margin-bottom: 18px;
    font-weight: 700;
  }
  
  .form-group { margin-bottom: 14px; }
  
  .form-group label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
    text-transform: uppercase;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  
  .form-group input, .form-group textarea, .form-group select {
    width: 100%;
    background: var(--bg-tertiary);
    color: var(--text-secondary);
    border: 1px solid var(--border);
    padding: 13px 14px;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
    font-family: inherit;
    min-height: 48px;
  }
  
  .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
    border-color: var(--accent);
  }
  
  .form-group textarea { resize: vertical; min-height: 80px; }
  
  .form-row { display: flex; gap: 10px; }
  .form-row > * { flex: 1; }
  
  .checkbox-group {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
    min-height: 48px;
  }
  
  .checkbox-group input { width: auto; }
  
  .checkbox-group label {
    margin: 0;
    text-transform: none;
    font-size: 14px;
    color: var(--text-secondary);
    cursor: pointer;
    font-weight: 500;
  }
  
  .recurring-options { display: none; margin-top: 10px; }
  .recurring-options.show { display: block; }
  .time-input-wrapper.disabled input { opacity: 0.35; pointer-events: none; }
  
  .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
  
  .btn {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    min-height: 48px;
    transition: all 0.15s;
  }
  
  .btn:active { transform: scale(0.97); }
  
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #a855f7);
    color: #fff;
  }
  
  .btn-secondary {
    background: var(--bg-tertiary);
    color: var(--text-muted);
    border: 1px solid var(--border);
  }
  
  .btn-danger {
    background: linear-gradient(135deg, #dc2626, #b91c1c);
    color: #fff;
  }
  
  .category-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  
  .category-item {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 6px 10px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 700;
  }
  
  .category-item .del-cat {
    background: none;
    border: none;
    color: inherit;
    opacity: 0.6;
    cursor: pointer;
    font-size: 16px;
    padding: 0 2px;
  }
  
  .import-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 14px;
    background: var(--bg-tertiary);
    padding: 4px;
    border-radius: 12px;
  }
  
  .import-tab {
    flex: 1;
    padding: 10px;
    border: none;
    background: transparent;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-dim);
    cursor: pointer;
    min-height: 44px;
  }
  
  .import-tab.active {
    background: var(--bg-secondary);
    color: var(--text-primary);
  }
  
  .import-view { display: none; }
  .import-view.active { display: block; }
  
  .file-drop {
    border: 2px dashed var(--border);
    border-radius: 14px;
    padding: 28px 16px;
    text-align: center;
    cursor: pointer;
    margin-bottom: 12px;
    min-height: 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  
  .file-drop.drag {
    border-color: var(--accent);
    background: var(--bg-tertiary);
  }
  
  .file-drop-icon { font-size: 36px; margin-bottom: 8px; }
  .file-drop-text { color: var(--text-dim); font-size: 13px; }
  
  .progress-bar {
    height: 6px;
    background: var(--bg-tertiary);
    border-radius: 3px;
    overflow: hidden;
    margin: 10px 0;
  }
  
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #a855f7);
    width: 0%;
    transition: width 0.3s;
  }
  
  .progress-text { font-size: 12px; color: var(--text-dim); text-align: center; }
  
  .recognized-text {
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    margin: 10px 0;
    max-height: 150px;
    overflow-y: auto;
    font-size: 13px;
    color: var(--text-muted);
    white-space: pre-wrap;
    font-family: monospace;
  }
  
  .parsed-task {
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 8px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  
  .parsed-task input[type="checkbox"] { accent-color: var(--accent); margin-top: 2px; width: 20px; height: 20px; }
  .parsed-task-info { flex: 1; font-size: 13px; }
  .parsed-task-info strong {
    color: var(--text-primary);
    font-weight: 700;
    display: block;
    margin-bottom: 3px;
  }
  .parsed-task-info small {
    color: var(--text-dim);
    display: block;
    line-height: 1.4;
  }
  
  .toast {
    position: fixed;
    top: calc(20px + var(--safe-top));
    left: 50%;
    transform: translateX(-50%) translateY(-150%);
    background: var(--bg-glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

<script>
// ===== ДАННЫЕ =====
const DEFAULT_CATEGORIES = [
  { id: 'study', name: 'Учёба', color: '#3b82f6', bg: '#1e3a5f' },
  { id: 'home', name: 'Дом', color: '#22c55e', bg: '#14532d' },
  { id: 'work', name: 'Работа', color: '#f97316', bg: '#7c2d12' },
  { id: 'personal', name: 'Личное', color: '#ec4899', bg: '#831843' },
  { id: 'rest', name: 'Отдых', color: '#a855f7', bg: '#581c87' }
];
const COLOR_PALETTE = ['#3b82f6','#22c55e','#f97316','#ec4899','#a855f7','#06b6d4','#eab308','#ef4444'];
const WEEKDAYS_FULL = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const WEEKDAYS_SHORT = ['вс','пн','вт','ср','чт','пт','сб'];
const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

const HOLIDAYS_2026 = [
  '2026-0-1','2026-0-2','2026-0-3','2026-0-4','2026-0-5','2026-0-6','2026-0-7','2026-0-8',
  '2026-1-23','2026-2-9','2026-4-1','2026-4-2','2026-4-3',
  '2026-4-9','2026-4-11','2026-5-12','2026-10-4'
];
const HOLIDAYS_2027 = [
  '2027-0-1','2027-0-2','2027-0-3','2027-0-4','2027-0-5','2027-0-6','2027-0-7','2027-0-8',
  '2027-1-22','2027-1-23','2027-2-8','2027-4-1','2027-4-2','2027-4-3',
  '2027-4-9','2027-4-10','2027-5-12','2027-5-14','2027-10-4'
];
const HOLIDAYS = [...HOLIDAYS_2026, ...HOLIDAYS_2027];

const SUMMER_VACATION = { startMonth: 6, startDay: 1, endMonth: 7, endDay: 31 };

let state = {
  tasks: {},
  templates: [],
  categories: [...DEFAULT_CATEGORIES],
  settings: { semesterStart: '2026-09-01', upperIsEven: true, theme: 'dark', notifEnabled: false },
  templateCompletions: {},
  notes: {}
};

function loadState() {
  const saved = localStorage.getItem('plannerState');
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      state = { ...state, ...parsed };
      state.settings = { ...{ semesterStart: '2026-09-01', upperIsEven: true, theme: 'dark', notifEnabled: false }, ...parsed.settings };
      if (!state.categories || state.categories.length === 0) state.categories = [...DEFAULT_CATEGORIES];
      if (!state.notes) state.notes = {};
    } catch(e) {}
  }
  applyTheme();
}

function saveState() { localStorage.setItem('plannerState', JSON.stringify(state)); }
function dateKey(d) { return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function vibrate(pattern) {
  if (navigator.vibrate) navigator.vibrate(pattern);
}

function applyTheme() {
  document.body.classList.toggle('light-theme', state.settings.theme === 'light');
}

function isHoliday(date) {
  const key = `${date.getFullYear()}-${date.getMonth()}-${date.getDate()}`;
  return HOLIDAYS.includes(key);
}

function isVacation(date) {
  const m = date.getMonth();
  const d = date.getDate();
  if (m === SUMMER_VACATION.startMonth && d >= SUMMER_VACATION.startDay) return true;
  if (m === SUMMER_VACATION.endMonth && d <= SUMMER_VACATION.endDay) return true;
  if (m > SUMMER_VACATION.startMonth && m < SUMMER_VACATION.endMonth) return true;
  return false;
}

function isFreeDay(date) {
  return isHoliday(date) || isVacation(date) || date.getDay() === 0;
}

function getWeekType(date) {
  const start = new Date(state.settings.semesterStart);
  start.setHours(0,0,0,0);
  const d = new Date(date); d.setHours(0,0,0,0);
  const diffDays = Math.floor((d - start) / 86400000);
  const weekNum = Math.floor(diffDays / 7);
  const isEven = weekNum % 2 === 0;
  return (state.settings.upperIsEven === isEven) ? 'upper' : 'lower';
}

function updateWeekBadge() {
  const badge = document.getElementById('weekBadge');
  const type = getWeekType(new Date());
  badge.textContent = type === 'upper' ? 'Верхняя' : 'Нижняя';
  badge.className = 'week-badge ' + type;
}

function getCategoryById(id) { return state.categories.find(c => c.id === id) || state.categories[0]; }

function renderCategorySelect(selectEl, selectedId) {
  selectEl.innerHTML = '';
  state.categories.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.id; opt.textContent = c.name;
    if (c.id === selectedId) opt.selected = true;
    selectEl.appendChild(opt);
  });
}

function hexToBg(hex) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgb(${Math.floor(r*0.25)},${Math.floor(g*0.25)},${Math.floor(b*0.25)})`;
}

function renderCategoryList() {
  const list = document.getElementById('categoryList');
  list.innerHTML = '';
  state.categories.forEach(c => {
    const item = document.createElement('div');
    item.className = 'category-item';
    item.style.background = c.bg; item.style.color = c.color;
    item.innerHTML = `<span>${c.name}</span>`;
    const isDefault = DEFAULT_CATEGORIES.some(d => d.id === c.id);
    if (!isDefault) {
      const del = document.createElement('button');
      del.className = 'del-cat'; del.textContent = '×';
      del.onclick = () => {
        state.categories = state.categories.filter(x => x.id !== c.id);
        saveState(); renderCategoryList();
      };
      item.appendChild(del);
    }
    list.appendChild(item);
  });
}

function addCategory() {
  const name = document.getElementById('newCatName').value.trim();
  const color = document.getElementById('newCatColor').value;
  if (!name) return;
  state.categories.push({ id: uid(), name, color, bg: hexToBg(color) });
  saveState();
  document.getElementById('newCatName').value = '';
  renderCategoryList();
}

// ===== КАЛЕНДАРЬ =====
let viewMonth = new Date().getMonth();
let viewYear = new Date().getFullYear();
let selectedDate = new Date();

function getCategoryColorsForDate(date) {
  if (isFreeDay(date)) return [];
  const colors = new Set();
  const key = dateKey(date);
  (state.tasks[key] || []).forEach(t => colors.add(getCategoryById(t.category).color));
  const weekday = date.getDay();
  const weekType = getWeekType(date);
  state.templates.forEach(t => {
    if ((t.weekday === weekday) && (t.weekType === 'both' || t.weekType === weekType)) {
      colors.add(getCategoryById(t.category).color);
    }
  });
  return [...colors];
}

function renderCalendar() {
  const daysEl = document.getElementById('days');
  const monthYearEl = document.getElementById('monthYear');
  daysEl.innerHTML = '';
  const monthNames = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
  monthYearEl.textContent = `${monthNames[viewMonth]} ${viewYear}`;

  const firstDay = new Date(viewYear, viewMonth, 1);
  let startOffset = (firstDay.getDay() + 6) % 7;
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();
  const today = new Date();

  for (let i = startOffset - 1; i >= 0; i--) {
    const div = document.createElement('div');
    div.className = 'day other-month';
    div.textContent = daysInPrevMonth - i;
    daysEl.appendChild(div);
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const div = document.createElement('div');
    div.className = 'day';
    div.textContent = d;
    const thisDate = new Date(viewYear, viewMonth, d);
    if (isFreeDay(thisDate)) div.classList.add('holiday');
    
    const colors = getCategoryColorsForDate(thisDate);
    if (colors.length > 0) {
      const dots = document.createElement('div');
      dots.className = 'day-dots';
      colors.slice(0, 5).forEach(color => {
        const dot = document.createElement('div');
        dot.className = 'day-dot';
        dot.style.background = color;
        dots.appendChild(dot);
      });
      div.appendChild(dots);
    }
    
    if (thisDate.toDateString() === today.toDateString()) div.classList.add('today');
    if (thisDate.toDateString() === selectedDate.toDateString()) div.classList.add('selected');
    div.onclick = () => {
      vibrate(10);
      selectedDate = new Date(viewYear, viewMonth, d);
      renderCalendar(); renderTasks();
    };
    daysEl.appendChild(div);
  }
  const totalCells = startOffset + daysInMonth;
  const remaining = (7 - (totalCells % 7)) % 7;
  for (let d = 1; d <= remaining; d++) {
    const div = document.createElement('div');
    div.className = 'day other-month';
    div.textContent = d;
    daysEl.appendChild(div);
  }
}

function getTasksForDate(date, includeTemplates = true) {
  if (isFreeDay(date)) {
    // В праздники показываем только одноразовые задачи
    const key = dateKey(date);
    return (state.tasks[key] || []).map(t => ({ ...t, _type: 'regular' }));
  }
  
  const key = dateKey(date);
  const regular = (state.tasks[key] || []).map(t => ({ ...t, _type: 'regular' }));
  
  if (!includeTemplates) return regular;
  
  const weekday = date.getDay();
  const weekType = getWeekType(date);
  const dayOfMonth = date.getDate();
  
  const recurring = state.templates
    .filter(t => {
      if (t.repeatType === 'weekly' || !t.repeatType) {
        return (t.weekday === weekday) && (t.weekType === 'both' || t.weekType === weekType);
      } else if (t.repeatType === 'biweekly') {
        if (t.weekday !== weekday) return false;
        const start = new Date(state.settings.semesterStart);
        start.setHours(0,0,0,0);
        const d = new Date(date); d.setHours(0,0,0,0);
        const diffWeeks = Math.floor((d - start) / (7 * 86400000));
        return diffWeeks % 2 === 0;
      } else if (t.repeatType === 'monthly') {
        return t.monthDay === dayOfMonth;
      } else if (t.repeatType === 'oddDays') {
        return dayOfMonth % 2 === 1;
      } else if (t.repeatType === 'evenDays') {
        return dayOfMonth % 2 === 0;
      }
      return false;
    })
    .map(t => ({ ...t, _type: 'template', done: !!state.templateCompletions[`${t.id}-${key}`] }));
  
  return [...regular, ...recurring].sort((a, b) => {
    if (!a.time && !b.time) return 0;
    if (!a.time) return 1;
    if (!b.time) return -1;
    return a.time.localeCompare(b.time);
  });
}

function renderTasks() {
  const listEl = document.getElementById('taskList');
  const dateEl = document.getElementById('selectedDate');
  const notesEl = document.getElementById('notesList');
  listEl.innerHTML = '';
  notesEl.innerHTML = '';
  
  let dateLabel = `${selectedDate.getDate()} ${MONTHS_GEN[selectedDate.getMonth()]} ${selectedDate.getFullYear()}`;
  if (isHoliday(selectedDate)) dateLabel += ' · Праздник';
  else if (isVacation(selectedDate)) dateLabel += ' · Каникулы';
  else if (selectedDate.getDay() === 0) dateLabel += ' · Воскресенье';
  dateEl.textContent = dateLabel;

  const dayTasks = getTasksForDate(selectedDate);
  if (dayTasks.length === 0) {
    listEl.innerHTML = '<div class="empty">На этот день задач нет</div>';
  } else {
    dayTasks.forEach(task => listEl.appendChild(createTaskElement(task, selectedDate)));
  }
  
  const key = dateKey(selectedDate);
  const dayNotes = state.notes[key] || [];
  if (dayNotes.length > 0) {
    const notesHeader = document.createElement('div');
    notesHeader.style.cssText = 'font-size:12px; color:var(--text-dim); margin:14px 0 8px; text-transform:uppercase; letter-spacing:0.5px; font-weight:700;';
    notesHeader.textContent = 'Заметки';
    notesEl.appendChild(notesHeader);
    dayNotes.forEach((note, idx) => {
      const div = document.createElement('div');
      div.className = 'note-item';
      div.textContent = note;
      const del = document.createElement('button');
      del.className = 'note-delete';
      del.textContent = '×';
      del.onclick = () => {
        state.notes[key].splice(idx, 1);
        if (state.notes[key].length === 0) delete state.notes[key];
        saveState(); renderTasks();
      };
      div.appendChild(del);
      notesEl.appendChild(div);
    });
  }
}

  const content = document.createElement('div');

  const header = document.createElement('div');
  header.className = 'task-header';
  
  const time = document.createElement('span');
  time.className = 'task-time';

  if (task.description) {

    content.appendChild(desc);
  }

  const meta = document.createElement('div');
  meta.className = 'task-meta';
  const cat = getCategoryById(task.category);
  const badge = document.createElement('span');
  badge.className = 'category-badge';
  badge.textContent = cat.name;
  badge.style.background = cat.bg; badge.style.color = cat.color;
  meta.appendChild(badge);
  
  if (task._type === 'template') {
    const rec = document.createElement('span');
    rec.className = 'recurring-badge';
    let wt = '';
    if (task.repeatType === 'biweekly') wt = '2 нед';
    else if (task.repeatType === 'monthly') wt = 'месяц';
    else if (task.repeatType === 'oddDays') wt = 'нечёт';
    else if (task.repeatType === 'evenDays') wt = 'чёт';
    else wt = task.weekType === 'both' ? 'каждую' : (task.weekType === 'upper' ? 'верх' : 'низ');
    rec.textContent = `🔁 ${wt}`;
    meta.appendChild(rec);
  }
  
  if (!isSchedule && task._type === 'regular') {
    const pomBtn = document.createElement('button');
    pomBtn.className = 'pomodoro-btn';
    pomBtn.textContent = '🍅';

    copyBtn.textContent = '📋';
    copyBtn.onclick = e => { e.stopPropagation(); vibrate(20); duplicateTask(task); };

  del.className = 'task-action-btn delete';
  del.textContent = '×';
  del.onclick = e => { e.stopPropagation(); vibrate(25); deleteTask(task, date); };
  actions.appendChild(del);

  li.onclick = () => { vibrate(10); openTaskModal(date, task, isSchedule); };
  li.appendChild(check); li.appendChild(content); li.appendChild(actions);
  return li;
}

// ===== TOUCH DRAG-AND-DROP =====
function setupTouchDrag(li, task) {
  let startX = 0, startY = 0, isDragging = false, longPressTimer = null;
  let currentDropTarget = null;
  
  li.setAttribute('draggable', 'true');
  
  // Desktop drag
  li.ondragstart = (e) => {
    e.dataTransfer.setData('text/plain', task.id);
    li.classList.add('dragging');
  };
  li.ondragend = () => li.classList.remove('dragging');
  
  // Mobile touch drag
  li.addEventListener('touchstart', (e) => {
    if (e.target.closest('.task-check, .task-action-btn, .pomodoro-btn')) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    longPressTimer = setTimeout(() => {
      isDragging = true;
      li.classList.add('dragging');
      vibrate(30);
    }, 400);
  }, { passive: true });
  
  li.addEventListener('touchmove', (e) => {
    if (!isDragging) {
      const dx = Math.abs(e.touches[0].clientX - startX);
      const dy = Math.abs(e.touches[0].clientY - startY);
      if (dx > 10 || dy > 10) {
        clearTimeout(longPressTimer);
      }
      return;
    }
    
    e.preventDefault();
    const touch = e.touches[0];
    const elem = document.elementFromPoint(touch.clientX, touch.clientY);
    const weekdayGroup = elem?.closest('.weekday-group');
    
    if (currentDropTarget && currentDropTarget !== weekdayGroup) {
      currentDropTarget.classList.remove('drag-over');
    }
    if (weekdayGroup && weekdayGroup !== currentDropTarget) {
      weekdayGroup.classList.add('drag-over');
      vibrate(10);
    }
    currentDropTarget = weekdayGroup;
  }, { passive: false });
  
  li.addEventListener('touchend', () => {
    clearTimeout(longPressTimer);
    if (isDragging && currentDropTarget) {
      const newWd = parseInt(currentDropTarget.dataset.weekday);
      if (!isNaN(newWd) && newWd !== task.weekday) {
        moveTaskToWeekday(task.id, newWd);
      }
      currentDropTarget.classList.remove('drag-over');
    }
    isDragging = false;
    li.classList.remove('dragging');
    currentDropTarget = null;
  });
}

function duplicateTask(task) {
  const newTask = { ...task, id: uid(), title: task.title + ' (копия)' };
  state.templates.push(newTask);
  saveState(); renderSchedule();
  showToast('Готово', 'Скопировано');
}

function toggleTaskDone(task, date, done) {
  const key = dateKey(date);
  if (task._type === 'template') {
    const compKey = `${task.id}-${key}`;
    if (done) state.templateCompletions[compKey] = true;
    else delete state.templateCompletions[compKey];
  } else {
    const arr = state.tasks[key] || [];
    const t = arr.find(x => x.id === task.id);
    if (t) t.done = done;
  }
  saveState(); renderTasks(); renderCalendar(); renderStats();
}

function deleteTask(task, date) {
  const key = dateKey(date);
  if (task._type === 'template') {
    state.templates = state.templates.filter(t => t.id !== task.id);
    Object.keys(state.templateCompletions).forEach(k => {
      if (k.startsWith(task.id + '-')) delete state.templateCompletions[k];
    });
  } else {
    state.tasks[key] = (state.tasks[key] || []).filter(t => t.id !== task.id);
    if (state.tasks[key].length === 0) delete state.tasks[key];
  }
  saveState(); renderTasks(); renderCalendar(); renderAllTasks(); renderSchedule();
}

document.getElementById('saveTaskBtn').onclick = () => {
  const title = document.getElementById('fTitle').value.trim();
  if (!title) { showToast('Ошибка', 'Введи название'); return; }
  
  const isAllDay = document.getElementById('fAllDay').checked;
  const time = isAllDay ? '' : document.getElementById('fTime').value;
  
  const data = {
    title,
    description: document.getElementById('fDesc').value.trim(),
    time,
    category: editingIsSchedule ? 'study' : document.getElementById('fCategory').value
  };
  
  const isRecurring = document.getElementById('fRecurring').checked;
  
  if (editingTask) {
    if (editingTask._type === 'template') {
      const t = state.templates.find(x => x.id === editingTask.id);
      if (t) {
        Object.assign(t, data);
        t.repeatType = document.getElementById('fRepeatType').value;
        if (t.repeatType === 'weekly' || t.repeatType === 'biweekly') {
          t.weekday = parseInt(document.getElementById('fWeekday').value);
          t.weekType = document.getElementById('fWeekType').value;
        } else if (t.repeatType === 'monthly') {
          t.monthDay = editingDate.getDate();
        }
      }
    } else {
      const key = dateKey(editingDate);
      const t = (state.tasks[key] || []).find(x => x.id === editingTask.id);
      if (t) Object.assign(t, data);
    }
  } else {
    if (isRecurring) {
      const repeatType = document.getElementById('fRepeatType').value;
      const template = { id: uid(), ...data, repeatType };
      if (repeatType === 'weekly' || repeatType === 'biweekly') {
        template.weekday = parseInt(document.getElementById('fWeekday').value);
        template.weekType = document.getElementById('fWeekType').value;
      } else if (repeatType === 'monthly') {
        template.monthDay = editingDate.getDate();
      }
      state.templates.push(template);
    } else {
      const key = dateKey(editingDate);
      if (!state.tasks[key]) state.tasks[key] = [];
      state.tasks[key].push({ id: uid(), ...data, done: false });
    }
  }
  
  vibrate(20);
  saveState();
  closeModal('taskModal');
  renderCalendar(); renderTasks(); renderAllTasks(); renderSchedule();
};

// ===== POMODORO =====
let pomodoroInterval = null;
let pomodoroSeconds = 25 * 60;
let pomodoroRunning = false;

function openPomodoro(taskTitle) {
  document.getElementById('pomodoroTask').textContent = taskTitle;
  pomodoroSeconds = 25 * 60;
  pomodoroRunning = false;
  updatePomodoroDisplay();
  document.getElementById('pomodoroModal').classList.add('show');
}

function updatePomodoroDisplay() {
  const mins = Math.floor(pomodoroSeconds / 60);
  const secs = pomodoroSeconds % 60;
  document.getElementById('pomodoroTime').textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
}

document.getElementById('pomodoroStart').onclick = () => {
  if (pomodoroRunning) {
    clearInterval(pomodoroInterval);
    pomodoroRunning = false;
    document.getElementById('pomodoroStart').textContent = 'Старт';
  } else {
    pomodoroRunning = true;
    document.getElementById('pomodoroStart').textContent = 'Пауза';
    pomodoroInterval = setInterval(() => {
      pomodoroSeconds--;
      updatePomodoroDisplay();
      if (pomodoroSeconds <= 0) {
        clearInterval(pomodoroInterval);
        pomodoroRunning = false;
        document.getElementById('pomodoroStart').textContent = 'Старт';
        vibrate([200, 100, 200, 100, 200]);
        showToast('🍅 Pomodoro', 'Время вышло! Перерыв 5 минут');
        if ('Notification' in window && Notification.permission === 'granted') {
          new Notification('🍅 Pomodoro', { body: 'Время вышло! Сделай перерыв' });
        }
      }
    }, 1000);
  }
};

document.getElementById('pomodoroReset').onclick = () => {
  clearInterval(pomodoroInterval);
  pomodoroRunning = false;
  pomodoroSeconds = 25 * 60;
  updatePomodoroDisplay();
  document.getElementById('pomodoroStart').textContent = 'Старт';
};

  const semesterStart = new Date(state.settings.semesterStart);

      rrule = `RRULE:FREQ=WEEKLY;INTERVAL=2;UNTIL=${formatIcsDateOnly(semesterEnd)}\r\n`;
    } else {

    }
    
    const dtStart = formatIcsDateTime(startDate, t.time || '09:00');

    ics += `UID:${t.id}@planner\r\n`;
    ics += `DTSTART:${dtStart}\r\n`;
    ics += `DTEND:${dtEnd}\r\n`;
    ics += `SUMMARY:${escapeIcs(t.title)}\r\n`;
    if (t.description) ics += `DESCRIPTION:${escapeIcs(t.description)}\r\n`;
    ics += rrule;
    ics += 'END:VEVENT\r\n';
  });
  
  ics += 'END:VCALENDAR';
  
  const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'schedule.ics';
  a.click();
  URL.revokeObjectURL(url);
  vibrate(20);
  showToast('Готово', 'Файл .ics скачан');
};

function formatIcsDateTime(date, time) {
  const [h, m] = time.split(':').map(Number);
  const y = date.getFullYear();
  const mo = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}${mo}${d}T${String(h).padStart(2,'0')}${String(m).padStart(2,'0')}00`;
}

function formatIcsDateOnly(date) {
  const y = date.getFullYear();
  const mo = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}${mo}${d}T235959Z`;
}

function escapeIcs(s) {
  return s.replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
}

function addMinutes(time, mins) {
  const [h, m] = time.split(':').map(Number);
  const total = h * 60 + m + mins;
  return `${String(Math.floor(total / 60) % 24).padStart(2,'0')}:${String(total % 60).padStart(2,'0')}`;
}

function renderStats() {
  const grid = document.getElementById('statsGrid');
  const today = new Date(); today.setHours(0,0,0,0);
  
  let done = 0, weekDone = 0, monthDone = 0;
  const weekAgo = new Date(today); weekAgo.setDate(weekAgo.getDate() - 7);
  const monthAgo = new Date(today); monthAgo.setDate(monthAgo.getDate() - 30);
  
  for (const key in state.tasks) {
    const [y, m, d] = key.split('-').map(Number);
    const date = new Date(y, m, d);
    state.tasks[key].forEach(t => {
      if (t.done) {
        done++;
        if (date >= weekAgo) weekDone++;
        if (date >= monthAgo) monthDone++;
      }
    });
  }
  
  grid.innerHTML = `
    <div class="stat-card"><div class="stat-value">${done}</div><div class="stat-label">Всего</div></div>
    <div class="stat-card"><div class="stat-value">${weekDone}</div><div class="stat-label">Неделя</div></div>
    <div class="stat-card"><div class="stat-value">${monthDone}</div><div class="stat-label">Месяц</div></div>
  `;
}

// ===== ДЕДЛАЙНЫ =====
function renderDeadlineWidget() {
  const widget = document.getElementById('deadlineWidget');
  const today = new Date(); today.setHours(0,0,0,0);
  
  const deadlines = [];
  for (const key in state.tasks) {
    const [y, m, d] = key.split('-').map(Number);
    const date = new Date(y, m, d);
    state.tasks[key].forEach(t => {
      if (!t.done && date >= today) {
        const days = Math.ceil((date - today) / 86400000);
        deadlines.push({ ...t, date, days });
      }
    });
  }
  
  deadlines.sort((a, b) => a.days - b.days);
  const top3 = deadlines.slice(0, 3);
  
  if (top3.length === 0) { widget.innerHTML = ''; return; }
  
  const isUrgent = top3.some(d => d.days <= 3);
  let html = `<div class="deadline-widget${isUrgent ? ' urgent' : ''}">`;
  html += '<div class="deadline-title">⏳ Ближайшие дедлайны</div>';
  top3.forEach(d => {
    html += `<div class="deadline-item">
      <span class="deadline-name">${d.title}</span>
      <span class="deadline-countdown">${d.days} ${pluralize(d.days,'д','д','д')}</span>
    </div>`;
  });
  html += '</div>';
  widget.innerHTML = html;
}

function renderAllTasks() {
  renderDeadlineWidget();
  const container = document.getElementById('allTasksList');
  container.innerHTML = '';
  const today = new Date(); today.setHours(0,0,0,0);
  
  const search = document.getElementById('searchInput').value.toLowerCase();
  const filterCat = document.getElementById('filterCategory').value;

  const allDates = new Map();
  for (const key in state.tasks) {
    if (state.tasks[key].length > 0) {
      const [y, m, d] = key.split('-').map(Number);
      allDates.set(new Date(y, m, d).toDateString(), new Date(y, m, d));
    }
  }

  [...allDates.values()].sort((a, b) => b - a).forEach(date => {
    let dayTasks = getTasksForDate(date, false);
    if (search) dayTasks = dayTasks.filter(t => t.title.toLowerCase().includes(search) || (t.description && t.description.toLowerCase().includes(search)));
    if (filterCat !== 'all') dayTasks = dayTasks.filter(t => t.category === filterCat);
    if (dayTasks.length === 0) return;

    const group = document.createElement('div');
    group.className = 'day-group';
    const header = document.createElement('div');
    header.className = 'day-group-header' + (date < today ? ' overdue' : '');
    const diff = Math.round((date - today) / 86400000);
    let label;
    if (diff === 0) label = 'Сегодня';
    else if (diff === 1) label = 'Завтра';
    else if (diff === -1) label = 'Вчера';
    else label = `${date.getDate()} ${MONTHS_GEN[date.getMonth()]}`;
    
    header.innerHTML = `<span>${date < today ? '⚠️ ' : ''}${label}</span><span class="count">${dayTasks.length} ${pluralize(dayTasks.length,'задача','задачи','задач')}</span>`;
    group.appendChild(header);

    const ul = document.createElement('ul');
    ul.className = 'task-list';
    dayTasks.forEach(task => ul.appendChild(createTaskElement(task, date)));
    group.appendChild(ul);
    container.appendChild(group);
  });

  if (container.children.length === 0) container.innerHTML = '<div class="empty">Задач нет</div>';
}

function renderSchedule() {
  const container = document.getElementById('scheduleList');
  container.innerHTML = '';
  
  if (state.templates.length === 0) {
    container.innerHTML = '<div class="empty">Расписание пустое</div>';
    return;
  }

  const byWeekday = {};
  state.templates.forEach(t => {
    const wd = (t.repeatType && t.repeatType !== 'weekly' && t.repeatType !== 'biweekly') ? -1 : t.weekday;
    if (!byWeekday[wd]) byWeekday[wd] = [];
    byWeekday[wd].push(t);
  });

  function renderWeekdayGroup(wd, tasks, title) {
    if (tasks.length === 0) return;
    const group = document.createElement('div');
    group.className = 'weekday-group';
    group.dataset.weekday = wd;
    
    if (wd >= 0) {
      group.ondragover = e => { e.preventDefault(); group.classList.add('drag-over'); };
      group.ondragleave = () => group.classList.remove('drag-over');
      group.ondrop = e => {
        e.preventDefault();
        group.classList.remove('drag-over');
        const taskId = e.dataTransfer.getData('text/plain');
        moveTaskToWeekday(taskId, wd);
      };
    }
    
    const header = document.createElement('div');
    header.className = 'weekday-header';
    header.innerHTML = `<span>${title}</span><span class="count">${tasks.length}</span>`;
    group.appendChild(header);

    const ul = document.createElement('ul');
    ul.className = 'task-list';
    tasks.sort((a,b) => {
      if (!a.time && !b.time) return 0;
      if (!a.time) return 1;
      if (!b.time) return -1;
      return a.time.localeCompare(b.time);
    }).forEach(t => {
      ul.appendChild(createTaskElement({ ...t, _type: 'template' }, new Date(), true));
    });
    group.appendChild(ul);
    container.appendChild(group);
  }

  [1,2,3,4,5,6,0].forEach(wd => {
    if (byWeekday[wd]) renderWeekdayGroup(wd, byWeekday[wd], WEEKDAYS_FULL[wd]);
  });
  if (byWeekday[-1]) renderWeekdayGroup(-1, byWeekday[-1], 'Особые');
}

function moveTaskToWeekday(taskId, newWeekday) {
  const task = state.templates.find(t => t.id === taskId);
  if (task) {
    task.weekday = newWeekday;
    saveState(); renderSchedule(); renderCalendar();
    vibrate(25);
    showToast('Готово', `→ ${WEEKDAYS_FULL[newWeekday]}`);
  }
}

function pluralize(n, one, two, five) {
  let abs = Math.abs(n) % 100;
  if (abs >= 5 && abs <= 20) return five;
  abs = abs % 10;
  if (abs === 1) return one;
  if (abs >= 2 && abs <= 4) return two;
  return five;
}

// ===== ПАРСЕР =====
const WEEKDAY_MAP = {
  'понедельник':1,'пн':1,'вторник':2,'вт':2,'среда':3,'ср':3,
  'четверг':4,'чт':4,'пятница':5,'пт':5,'суббота':6,'сб':6,'воскресенье':0,'вс':0
};

function parseTextToTasks(text) {
  const results = [];
  const lines = text.split('\n').map(l => l.trim()).filter(l => l);
  let currentWeekday = null;
  const timeRegex = /(\d{1,2})[:.\-](\d{2})/;
  const dateRegex = /(\d{1,2})[./](\d{1,2})(?:[./](\d{2,4}))?/;
  
  for (let line of lines) {
    let isDayHeader = false;
    for (const [word, num] of Object.entries(WEEKDAY_MAP)) {
      if (new RegExp(`^\\s*${word}\\s*$`, 'i').test(line)) {
        currentWeekday = num; isDayHeader = true; break;
      }
    }
    if (isDayHeader) continue;
    
    let weekType = null, cleanLine = line;
    const upperMatch = line.match(/верхн(яя|ей|юю)\s+недел(я|и|ю):\s*/i);
    const lowerMatch = line.match(/нижн(яя|ей|юю)\s+недел(я|и|ю):\s*/i);
    if (upperMatch) { weekType = 'upper'; cleanLine = line.replace(upperMatch[0], '').trim(); }
    else if (lowerMatch) { weekType = 'lower'; cleanLine = line.replace(lowerMatch[0], '').trim(); }
    
    let lineDate = null;
    const dateMatch = cleanLine.match(dateRegex);
    if (dateMatch) {
      const day = parseInt(dateMatch[1]), month = parseInt(dateMatch[2]) - 1;
      const year = dateMatch[3] ? parseInt(dateMatch[3]) : new Date().getFullYear();
      const fullYear = year < 100 ? 2000 + year : year;
      const d = new Date(fullYear, month, day);
      if (!isNaN(d.getTime()) && day >= 1 && day <= 31 && month >= 0 && month <= 11) lineDate = d;
    }
    
    const today = new Date(); today.setHours(0,0,0,0);
    if (/\bсегодня\b/i.test(cleanLine)) lineDate = new Date(today);
    else if (/\bзавтра\b/i.test(cleanLine)) { const d = new Date(today); d.setDate(d.getDate() + 1); lineDate = d; }
    
    let time = null;
    const timeMatch = cleanLine.match(timeRegex);
    if (timeMatch) {
      const h = parseInt(timeMatch[1]), m = parseInt(timeMatch[2]);
      if (h >= 0 && h <= 23 && m >= 0 && m <= 59) time = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
    }
    
    let title = cleanLine;
    if (timeMatch) title = title.replace(timeMatch[0], '');
    if (dateMatch) title = title.replace(dateMatch[0], '');
    title = title.replace(/\b(сегодня|завтра|послезавтра)\b/gi, '');
    title = title.replace(/^[—\-–,.\s]+/, '').replace(/[—\-–,.\s]+$/, '').trim();
    if (!title) continue;
    
    let category = 'personal';
    const tl = title.toLowerCase();
    const studyPatterns = [/\bлекци/i, /\bсеминар/i, /\bпрактик/i, /\bпар(а|ы|е)\b/i,
      /\bлабораторн/i, /\bаудитори/i, /\bа\.\s*\d/i, /\bнирфи\b/i, /\bю\.?ф\.?\b/i, /\bвкс\b/i,
      /\bзач(ёт|ет)/i, /\bэкзамен/i, /\bкурсов/i, /\bдиплом/i, /\bпроблем(ы|а)/i,
      /\bактуальн/i, /\bорганизаци/i, /\bуправлен/i, /\bпроект/i, /\bквалификаци/i,
      /\bпреследован/i, /\bпрокуратур/i, /\bследственн/i, /\bкримин/i, /\bполитик/i,
      /\bконституцион/i, /\bгражданск/i, /\bуголовн/i, /\bпроцесс/i,
      /\bправ(о|а|у|ом)\b/i, /\bгосударств/i, /\bмуниципальн/i];
    
    if (studyPatterns.some(p => p.test(tl))) category = 'study';
    else if (/\bдом\b|квартир|убор|готовк|покуп|магазин/i.test(tl)) category = 'home';
    else if (/\bработ|дедлайн|отч(ёт|ет)|смен|клиент/i.test(tl)) category = 'work';
    else if (/\bотдых|кино|театр|гуля|спортзал|тренир/i.test(tl)) category = 'rest';
    
    let taskType, weekday = null, date = null, finalWeekType = 'both';
    if (lineDate) { taskType = 'regular'; date = lineDate; }
    else if (weekType !== null) { taskType = 'template'; weekday = currentWeekday; finalWeekType = weekType; }
    else if (currentWeekday !== null) { taskType = 'template'; weekday = currentWeekday; }
    else { taskType = 'regular'; date = new Date(); }
    
    results.push({
      title: title.slice(0, 100), time, category: taskType === 'template' ? 'study' : category,
      taskType, weekday, weekType: finalWeekType, date: date ? dateKey(date) : null
    });
  }
  return results;
}

function renderParsedTasks(parsed, containerId) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  if (parsed.length === 0) { container.innerHTML = '<div class="empty">Не нашлось задач</div>'; return; }
  
  parsed.forEach((task, idx) => {
    const div = document.createElement('div');
    div.className = 'parsed-task';
    const check = document.createElement('input');
    check.type = 'checkbox'; check.checked = true; check.dataset.idx = idx;
    const info = document.createElement('div');
    info.className = 'parsed-task-info';
    let dateStr = '';
    if (task.taskType === 'template') {
      const wt = task.weekType === 'both' ? 'каждую' : (task.weekType === 'upper' ? 'верхнюю' : 'нижнюю');
      dateStr = `🔁 ${WEEKDAYS_FULL[task.weekday]}, ${wt}`;
    } else if (task.date) {
      const [y,m,d] = task.date.split('-').map(Number);
      dateStr = `📅 ${d} ${MONTHS_GEN[m]}`;
    } else dateStr = `📅 Сегодня`;
    const timeStr = task.time ? `⏰ ${task.time}` : '🕐 весь день';
    const cat = getCategoryById(task.category);
    info.innerHTML = `<strong>${task.title}</strong><small>${timeStr} · ${dateStr} · <span style="color:${cat.color}">${cat.name}</span></small>`;
    div.appendChild(check); div.appendChild(info);
    container.appendChild(div);
  });
  
  const saveBtn = document.createElement('button');
  saveBtn.className = 'btn btn-primary';
  saveBtn.style.cssText = 'width:100%; margin-top:12px';
  saveBtn.textContent = `✓ Добавить (${parsed.length})`;
  saveBtn.onclick = () => {
    const checked = container.querySelectorAll('input[type="checkbox"]:checked');
    let added = 0;
    checked.forEach(chk => {
      const idx = parseInt(chk.dataset.idx);
      const task = parsed[idx];
      if (task.taskType === 'template') {
        state.templates.push({
          id: uid(), title: task.title, description: '', time: task.time,
          category: 'study', weekday: task.weekday, weekType: task.weekType, repeatType: 'weekly'
        });
      } else {
        const key = task.date || dateKey(new Date());
        if (!state.tasks[key]) state.tasks[key] = [];
        state.tasks[key].push({ id: uid(), title: task.title, description: '', time: task.time, category: task.category, done: false });
      }
      added++;
    });
    saveState();
    renderCalendar(); renderTasks(); renderAllTasks(); renderSchedule();
    closeModal('importModal');
    vibrate(25);
    showToast('Готово!', `Добавлено: ${added}`);
  };
  container.appendChild(saveBtn);
}

async function handleFile(file) {
  if (!file.type.startsWith('image/')) { showToast('Ошибка', 'Не изображение'); return; }
  if (typeof Tesseract === 'undefined') {
    showToast('Ошибка', 'OCR недоступен. Нужен интернет для первой загрузки.');
    return;
  }
  const progress = document.getElementById('ocrProgress');
  const progressFill = document.getElementById('progressFill');
  const progressText = document.getElementById('progressText');
  progress.style.display = 'block';
  document.getElementById('recognizedBlock').style.display = 'none';
  document.getElementById('parsedFromPhoto').innerHTML = '';
  try {
    progressText.textContent = 'Инициализация...';
    progressFill.style.width = '10%';
    const result = await Tesseract.recognize(file, 'rus+eng', {
      logger: m => {
        if (m.status === 'recognizing text') {
          progressFill.style.width = (10 + m.progress * 85) + '%';
          progressText.textContent = `Распознавание... ${Math.round(m.progress * 100)}%`;
        } else progressText.textContent = m.status;
      }
    });
    progressFill.style.width = '100%';
    progressText.textContent = 'Готово!';
    document.getElementById('recognizedText').textContent = result.data.text;
    document.getElementById('recognizedBlock').style.display = 'block';
    setTimeout(() => { progress.style.display = 'none'; }, 800);
  } catch (err) {
    progress.style.display = 'none';
    showToast('Ошибка OCR', err.message || 'Не удалось');
  }
}
